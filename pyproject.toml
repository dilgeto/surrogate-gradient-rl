[project]
name = "sgrl"
version = "0.1.0"
description = "Gradientes surrogados (LIF de snnTorch) con ruido de memristores en tareas de RL con entornos de RLTools"
requires-python = ">=3.10"
dependencies = ["torch", "snntorch", "numpy", "matplotlib"]

[project.optional-dependencies]
sb3 = ["stable-baselines3"]
optuna = ["optuna"]  # scripts/optuna_search.py, optuna_report.py
analysis = ["pandas"]  # scripts/summarize_noise.py, plot_noise.py, run_noise_sweeps.py

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sgrl"]
